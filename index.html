<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма консультації</title>
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

<section class="consultation">
    <div class="consultation__container">
        <h2>Підберемо курс разом</h2>
        <p>Залиш контакт — і наша команда допоможе
           обрати напрям навчання.</p>

        <form class="consultation__form">
            <div class="field">
                <label for="name">Ім'я</label>
                <input
                    id="name"
                    name="name"
                    type="text"
                    placeholder="Введіть ваше ім'я"
                    required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="example@gmail.com"
                    required>
            </div>

            <div class="field field--wide">
                <label for="direction">Напрям навчання</label>
                <select id="direction" name="direction">
                    <option value="frontend">FrontEnd</option>
                    <option value="gamedev">GameDev</option>
                    <option value="design">Design</option>
                </select>
            </div>

            <button class="consultation__button field--wide"
                    type="submit">
                Надіслати заявку
            </button>
        </form>
    </div>
</section>

</body>
</html>
